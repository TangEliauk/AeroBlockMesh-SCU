name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: python -m pip install ".[dev,data]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check Python syntax
        run: python -m compileall -q src scripts tests
      - name: Run existing data regression tests
        run: python -m unittest discover -s tests/data -p "test_*.py" -v
      - name: Verify frozen public data
        run: python scripts/data/verify_public_data.py
      - name: Reproduce cleaned multiblock references
        run: |
          python scripts/data/verify_multiblock_data.py
          python scripts/data/clean_cgns_multiblock.py --check
          python scripts/data/clean_engineering_multiblock.py --check
      - name: Reproduce cleaned 2D multiblock references
        run: |
          python scripts/data/verify_2d_multiblock_data.py
          python scripts/data/clean_2d_multiblock.py --check

  fusion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system dependency for Gmsh imports
        run: sudo apt-get update && sudo apt-get install -y libglu1-mesa
      - name: Install fusion dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,data,fusion,ch-sac]" numpy==2.3.1 PyYAML==6.0.2
          python -m pip check
      - name: Test fusion and report generation
        run: python -m pytest -q tests/test_airfoil_fusion.py tests/test_airfoil_study_report.py
      - name: Verify published weights and replay a sealed case
        run: python scripts/verify_airfoil_fusion_release.py --replay
      - name: Import all package modules
        run: |
          python - <<'PY'
          import importlib
          import pkgutil
          import smartcfd

          for module in pkgutil.walk_packages(smartcfd.__path__, smartcfd.__name__ + "."):
              importlib.import_module(module.name)
          print("smartcfd", smartcfd.__version__)
          PY
      - name: Check script help
        run: |
          set -e
          for script in scripts/*.py; do
            python "$script" --help
          done
